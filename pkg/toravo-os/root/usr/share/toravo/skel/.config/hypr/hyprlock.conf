# Toravo OS lock screen – big clock + claim like the trailer
general {
    hide_cursor = true
    ignore_empty_input = true
}
animations {
    enabled = true
    bezier = toravo, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, toravo
    animation = fadeOut, 1, 3, toravo
}
background {
    monitor =
    path = /usr/share/toravo/wallpaper/toravo-lock.png
    color = rgb(07070d)
}
label {
    monitor =
    text = $TIME
    color = rgb(f2f2f7)
    font_size = 120
    font_family = Inter Light
    position = 0, 170
    halign = center
    valign = center
}
label {
    monitor =
    text = <span letter_spacing="4200">THE AI CONTENT CREATOR OS</span>
    color = rgb(6c6a85)
    font_size = 12
    font_family = Inter Medium
    position = 0, 70
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B"
    color = rgb(a9a8bd)
    font_size = 14
    font_family = Inter
    position = 0, 34
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 380, 54
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgb(24213a)
    inner_color = rgb(12111c)
    font_color = rgb(f2f2f7)
    check_color = rgb(8a5cf6) rgb(6f9be0) 45deg
    fail_color = rgb(d8806a)
    fade_on_empty = false
    rounding = 12
    font_family = Inter
    placeholder_text = <span foreground="##6c6a85">❯  Passwort</span>
    fail_text = <span foreground="##d8806a">$FAIL</span>
    position = 0, -70
    halign = center
    valign = center
}
label {
    monitor =
    text = <span letter_spacing="5000" weight="600">TORAVO<span foreground="##8a5cf6">/</span>OS</span>
    color = rgb(a9a8bd)
    font_size = 11
    font_family = Inter
    position = 0, 40
    halign = center
    valign = bottom
}
