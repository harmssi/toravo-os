LABEL toravo
TEXT HELP
Toravo OS starten: ausprobieren oder installieren.
ENDTEXT
MENU LABEL Toravo OS - Live & Installieren
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL toravosafe
TEXT HELP
Fuer alte oder unbekannte Grafikkarten: ohne Grafiktreiber, Lite-Modus.
ENDTEXT
MENU LABEL Toravo OS - sichere Grafik (Lite)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 nomodeset toravo.lite

