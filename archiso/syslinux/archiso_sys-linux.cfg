LABEL toravo
TEXT HELP
Toravo OS starten: ausprobieren oder installieren.
ENDTEXT
MENU LABEL Toravo OS - Live & Installieren
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL toravoen
TEXT HELP
Start Toravo OS in English (US keyboard): try it or install it.
ENDTEXT
MENU LABEL Toravo OS (English) - Live & Install
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 locale.LANG=en_US.UTF-8 vconsole.keymap=us toravo.xkb=us

LABEL toravosafe
TEXT HELP
Fuer alte oder unbekannte Grafikkarten / for old or unknown GPUs: no graphics driver, Lite mode.
